<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Realm of Shadows</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #080a10;
    --panel: #111522;
    --panel-2: #171c29;
    --border: #30374b;
    --gold: #d9b86c;
    --gold-dark: #8d672f;
    --text: #eeeeee;
    --muted: #999;
    --red: #e66a6a;
    --green: #78d68c;
    --blue: #527aa5;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            circle at top,
            #151b2b 0,
            #080a10 55%
        );
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}

/* =========================================================
   GENEL
========================================================= */

#game {
    min-height: 100vh;
}

/* =========================================================
   ÜST BAR
========================================================= */

.topbar {
    min-height: 70px;
    padding: 12px 20px;

    background: #111522;
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;

    position: sticky;
    top: 0;
    z-index: 50;
}

.logo {
    color: var(--gold);
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

.top-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.top-buttons button {
    background: #1b2130;
    color: #eee;

    border: 1px solid #394158;
    border-radius: 8px;

    padding: 9px 13px;

    transition: .2s;
}

.top-buttons button:hover {
    background: #2a3247;
    border-color: var(--gold);
}

/* =========================================================
   ANA LAYOUT
========================================================= */

.game-layout {
    width: min(1500px, 100%);
    margin: auto;
    padding: 15px;

    display: grid;
    grid-template-columns: 250px minmax(400px, 1fr) 280px;
    gap: 15px;
}

.left-panel,
.right-panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* =========================================================
   KARTLAR
========================================================= */

.character-card,
.stats-card,
.side-card,
.story-panel {
    background: rgba(17, 21, 34, .96);
    border: 1px solid var(--border);
    border-radius: 12px;
}

.character-card,
.stats-card,
.side-card {
    padding: 16px;
}

.character-card {
    text-align: center;
}

.character-card h2 {
    margin: 10px 0 4px;
}

.character-card p {
    margin: 0;
    color: var(--muted);
}

.avatar {
    width: 80px;
    height: 80px;
    margin: auto;

    display: grid;
    place-items: center;

    background: #1c2334;
    border: 1px solid #444e69;
    border-radius: 50%;

    font-size: 42px;
}

.stats-card h3,
.side-card h3 {
    margin-top: 0;
    color: var(--gold);
}

/* =========================================================
   STATLAR
========================================================= */

.stat,
.ability {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 8px 0;
    border-bottom: 1px solid #242a39;
}

.stat:last-child,
.ability:last-child {
    border-bottom: 0;
}

.stat strong,
.ability strong {
    color: #fff;
}

/* =========================================================
   STORY
========================================================= */

.story-panel {
    min-height: 700px;
    padding: 15px;

    display: flex;
    flex-direction: column;
}

.location {
    background: #181d2a;
    border: 1px solid #343c53;
    border-radius: 9px;

    padding: 12px;
    margin-bottom: 12px;
}

.location-label {
    color: #999;
    font-size: 13px;
    margin-bottom: 4px;
}

#location {
    color: #e4c77d;
}

.story {
    flex: 1;

    overflow-y: auto;

    min-height: 430px;
    max-height: 600px;

    padding: 5px;

    scrollbar-width: thin;
}

.story-message {
    padding: 12px 14px;
    margin-bottom: 12px;

    border-radius: 10px;

    line-height: 1.65;
}

.story-message.dm {
    background: #171c29;
    border-left: 3px solid var(--gold-dark);
}

.story-message.player {
    background: #182332;
    border-left: 3px solid var(--blue);
}

.message-author {
    margin-bottom: 5px;

    font-size: 12px;
    font-weight: bold;

    color: #caa968;
}

.message-content {
    margin: 0;
}

/* =========================================================
   COMBAT
========================================================= */

.combat-status {
    margin-top: 10px;
    margin-bottom: 2px;

    padding: 12px;

    background: #241719;

    border: 1px solid #7d3939;
    border-radius: 9px;

    display: flex;
    justify-content: space-around;
    align-items: center;

    gap: 10px;
    flex-wrap: wrap;
}

.combat-status-title {
    color: var(--red);
    font-weight: bold;
}

/* =========================================================
   ACTION
========================================================= */

.action-area {
    margin-top: 12px;
}

#playerInput {
    width: 100%;

    min-height: 75px;

    padding: 12px;

    resize: vertical;

    background: #0b0e16;
    color: #eee;

    border: 1px solid #394158;
    border-radius: 9px;

    outline: none;
}

#playerInput:focus {
    border-color: var(--gold);
}

.action-button {
    width: 100%;

    margin-top: 8px;
    padding: 12px;

    border: 0;
    border-radius: 9px;

    background: var(--gold-dark);
    color: #fff;

    font-weight: bold;

    transition: .2s;
}

.action-button:hover {
    background: #a87c38;
}

/* =========================================================
   QUESTS
========================================================= */

.side-card-header,
.modal-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.item-count {
    background: var(--gold-dark);

    border-radius: 20px;

    padding: 3px 9px;

    font-size: 12px;
}

.quest-item {
    padding: 10px;
    margin-bottom: 9px;

    background: #181d2a;
    border-radius: 8px;
}

.quest-item:last-child {
    margin-bottom: 0;
}

.quest-item p {
    color: #aaa;
    font-size: 13px;
    line-height: 1.5;
}

.quest-item ul {
    padding-left: 20px;
    margin-bottom: 8px;

    font-size: 13px;
}

.quest-item li {
    margin-bottom: 4px;
}

.quest-item small {
    color: var(--gold);
}

/* =========================================================
   DICE
========================================================= */

.dice-card {
    text-align: center;
}

.dice-result {
    height: 70px;

    display: grid;
    place-items: center;

    font-size: 38px;
    font-weight: bold;

    color: var(--gold);
}

.dice-button {
    width: 100%;

    padding: 10px;

    background: #252c3d;
    color: #fff;

    border: 1px solid #414b65;
    border-radius: 8px;

    transition: .2s;
}

.dice-button:hover {
    background: #34405a;
}

/* =========================================================
   INVENTORY
========================================================= */

.inventory-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.inventory-item {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 12px;

    background: #171c29;

    border: 1px solid #30374b;
    border-radius: 9px;
}

.inventory-item-icon {
    font-size: 27px;
}

.inventory-item-info {
    flex: 1;

    display: flex;
    flex-direction: column;
    gap: 3px;
}

.inventory-item-info span {
    font-size: 12px;
    color: #999;
}

.inventory-item-info .equipped {
    color: var(--green);
}

.inventory-use-button {
    background: #252d40;
    color: #fff;

    border: 1px solid #414b65;
    border-radius: 7px;

    padding: 8px 10px;
}

.inventory-use-button:hover {
    background: #34405a;
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 1000;

    background: rgba(0, 0, 0, .78);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.modal-content {
    width: min(520px, 100%);
    max-height: 90vh;

    overflow: auto;

    position: relative;

    background: #111522;

    border: 1px solid #414b65;
    border-radius: 13px;

    padding: 22px;
}

.close {
    position: absolute;

    right: 12px;
    top: 10px;

    border: 0;
    background: transparent;

    color: #aaa;

    font-size: 30px;
}

.close:hover {
    color: #fff;
}

.modal-content label {
    display: block;

    margin: 12px 0 5px;

    color: #bbb;
}

.modal-content input,
.modal-content select {
    width: 100%;

    padding: 10px;

    background: #0b0e16;
    color: #eee;

    border: 1px solid #394158;
    border-radius: 7px;

    outline: none;
}

.modal-content input:focus,
.modal-content select:focus {
    border-color: var(--gold);
}

.character-info {
    line-height: 1.6;
}

.character-info p {
    margin: 7px 0;
}

.character-info hr {
    border: 0;
    border-top: 1px solid #30374b;
    margin: 15px 0;
}

.empty {
    color: #888;
    text-align: center;
}

/* =========================================================
   TOAST
========================================================= */

#toastContainer {
    position: fixed;
    right: 18px;
    bottom: 18px;

    z-index: 2000;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    min-width: 240px;
    max-width: 350px;

    padding: 12px 15px;

    background: #171c29;

    border: 1px solid #414b65;
    border-radius: 9px;

    box-shadow: 0 10px 30px rgba(0,0,0,.4);

    animation: toastIn .25s ease;
}

@keyframes toastIn {
    from {
        transform: translateY(15px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* =========================================================
   MOBİL
========================================================= */

@media(max-width:1050px) {

    .game-layout {
        grid-template-columns: 220px 1fr;
    }

    .right-panel {
        grid-column: 1 / -1;

        display: grid;
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:750px) {

    .topbar {
        flex-direction: column;
        align-items: stretch;
    }

    .logo {
        text-align: center;
    }

    .top-buttons {
        justify-content: center;
    }

    .game-layout {
        grid-template-columns: 1fr;
    }

    .right-panel {
        grid-column: auto;
        display: flex;
    }

    .story-panel {
        min-height: 600px;
    }

    .story {
        min-height: 350px;
        max-height: 500px;
    }

    .inventory-item {
        align-items: flex-start;
    }

    .inventory-use-button {
        padding: 7px 8px;
    }
}
</style>
</head>

/* =========================================================
   YARDIMCI FONKSİYONLAR
========================================================= */

const $ = id => document.getElementById(id);

function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

function clone(value) {
    return JSON.parse(JSON.stringify(value));
}

function randomInt(min, max) {
    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}

function rollDice(notation) {

    const match = String(notation)
        .trim()
        .match(/^(\d+)d(\d+)$/i);

    if (!match) {
        return 0;
    }

    const amount = Number(match[1]);
    const sides = Number(match[2]);

    let total = 0;

    for (let i = 0; i < amount; i++) {
        total += randomInt(1, sides);
    }

    return total;
}

function modifier(stat) {
    return Math.floor(
        (Number(stat) - 10) / 2
    );
}

function showToast(message) {

    const container = $("toastContainer");

    const toast = document.createElement("div");

    toast.className = "toast";
    toast.innerHTML = message;

    container.appendChild(toast);

        $("story").scrollHeight;
}

function completeObjective(questId, objectiveId) {

    const quest =
        game.quests.find(
            q => q.id === questId
        );

    if (!quest) {
        return;
    }

    const objective =
        quest.objectives.find(
            o => o.id === objectiveId
        );

    if (!objective || objective.completed) {
        return;
    }

    objective.completed = true;

    const finished =
        quest.objectives.every(
            o => o.completed
        );

    if (finished) {

        quest.status = "completed";

        game.player.gold += quest.reward;

        addStoryMessage(`

            🎉 <b>GÖREV TAMAMLANDI!</b>

            <br><br>

            📜 ${escapeHTML(quest.title)}

            <br><br>

            💰 Ödül:
            <b>${quest.reward} altın</b>

        `);

        showToast(
            `🎉 Görev tamamlandı! +${quest.reward} altın`
        );
    }

    updateAllUI();
}


function updateQuestUI() {

    const container = $("quests");

    container.innerHTML = "";

    const active =
        game.quests.filter(
            q => q.status === "active"
        );

    $("questCount").textContent =
        active.length;

    if (!active.length) {

        container.innerHTML =
            `<p class="empty">Aktif görev yok.</p>`;

        return;
    }

    active.forEach(quest => {

        const completed =
            quest.objectives.filter(
                objective => objective.completed
            ).length;

        const element =
            document.createElement("div");

        element.className =
            "quest-item";

        element.innerHTML = `

            <strong>
                📜 ${escapeHTML(quest.title)}
            </strong>

            <p>
                ${escapeHTML(quest.description)}
            </p>

            <div>
                İlerleme:
                <b>
                    ${completed}/${quest.objectives.length}
                </b>
            </div>

            <ul>

                ${quest.objectives.map(
                    objective => `

                            ${objective.completed ? "✅" : "⬜"}
                            ${escapeHTML(objective.text)}
                        </li>

                    `
                ).join("")}

            </ul>

            <small>
                💰 Ödül: ${quest.reward} altın
            </small>
        `;

        container.appendChild(element);

    });
}

/* =========================================================
   INVENTORY
========================================================= */

function getInventoryItem(id) {

    return game.player.inventory.find(
        item => item.id === id
    );
}


function removeEmptyInventoryItems() {

    game.player.inventory =
        game.player.inventory.filter(
            item =>
                Number(item.quantity || 0) > 0
        );
}


function getItemIcon(type) {

    if (type === "weapon") {
        return "⚔️";
    }

    if (type === "consumable") {
        return "🧪";
    }

    if (type === "utility") {
        return "🔥";
    }

    return "📦";
}


function updateInventoryUI() {

    const container =
        $("inventory");

    container.innerHTML = "";

    const inventory =
        game.player.inventory;

    const total =
        inventory.reduce(
            (sum, item) =>
                sum + Number(item.quantity || 0),
            0
        );

    $("inventoryCount").textContent =
        total;

    if (!inventory.length) {

        container.innerHTML =
            `<p class="empty">Envanter boş.</p>`;

        return;
    }

    inventory.forEach(item => {

        const element =
            document.createElement("div");

        element.className =
            "inventory-item";

        let action = "Kullan";

        if (item.type === "weapon") {

            action =
                item.equipped
                    ? "Bırak"
                    : "Kuşan";

        }

        if (item.type === "utility") {

            action =
                game.world.torchActive
                    ? "Söndür"
                    : "Yak";

        }

        element.innerHTML = `

            <div class="inventory-item-icon">
                ${getItemIcon(item.type)}
            </div>

            <div class="inventory-item-info">

                <strong>
                    ${escapeHTML(item.name)}
                </strong>

                <span>
                    Adet: ${item.quantity}
                </span>

                ${
                    item.damage
                        ? `<span>Hasar: ${escapeHTML(item.damage)}</span>`
                        : ""
                }

                ${
                    item.equipped
                        ? `<span class="equipped">⚔️ Kuşanılmış</span>`
                        : ""
                }

            </div>

            <button
                class="inventory-use-button"
                type="button"
            >
                ${action}
            </button>
        `;

        element
            .querySelector("button")
            .addEventListener(
                "click",
                () => useInventoryItem(item.id)
            );

        container.appendChild(element);

    });
}


function useInventoryItem(id) {

    const item =
        getInventoryItem(id);

    if (!item) {
        return;
    }

    if (item.type === "weapon") {
        toggleWeapon(item);
        return;
    }

    if (item.type === "consumable") {
        usePotion(item);
        return;
    }

    if (item.type === "utility") {
        useTorch(item);
    }
}


function toggleWeapon(item) {

    if (item.equipped) {

        item.equipped = false;

        game.player.equippedWeapon =
            null;

        addStoryMessage(
            `⚔️ ${escapeHTML(item.name)} kuşandan çıkarıldı.`
        );

    } else {

        game.player.inventory.forEach(
            other => {

                if (other.type === "weapon") {
                    other.equipped = false;
                }

            }
        );

        item.equipped = true;

        game.player.equippedWeapon =
            item.id;

        addStoryMessage(
            `⚔️ <b>${escapeHTML(item.name)}</b> kuşandın.`
        );
    }

    updateAllUI();
}


function usePotion(item) {

    if (game.player.hp >= game.player.maxHp) {

        addStoryMessage(
            "❤️ Canın zaten tamamen dolu."
        );

        return false;
    }

    const before =
        game.player.hp;

    game.player.hp =
        Math.min(
            game.player.maxHp,
            game.player.hp +
            Number(item.heal || 10)
        );

    const healed =
        game.player.hp - before;

    item.quantity--;

    removeEmptyInventoryItems();

    addStoryMessage(`

        🧪 <b>Şifa İksiri kullandın.</b>

        <br><br>

        ❤️ <b>${healed}</b> can yenilendi.

        <br>

        Can:
        <b>${game.player.hp}/${game.player.maxHp}</b>

    `);

    updateAllUI();

    return true;
}


function useTorch(item) {

    if (game.world.torchActive) {

        game.world.torchActive = false;

        addStoryMessage(
            "🔥 Meşaleyi söndürdün."
        );

    } else {

        if (item.quantity <= 0) {

            addStoryMessage(
                "🔥 Kullanılabilir meşalen yok."
            );

            return;
        }

        item.quantity--;

        game.world.torchActive = true;

        removeEmptyInventoryItems();

        addStoryMessage(`

            🔥 <b>Meşaleyi yaktın.</b>

            <br><br>

            Karanlık çevre artık daha görünür.

        `);
    }

    updateAllUI();
}

function startCombat(enemyId = "shadowWolf") {

    if (game.combat.active) {

        addStoryMessage(
            "⚔️ Zaten savaştasın."
        );

        return;
    }

    const template =
        ENEMIES[enemyId];

    if (!template) {
        return;
    }

    game.combat = {

        active: true,

        enemy: clone(template),

        round: 1

    };

    const enemy =
        game.combat.enemy;

    addStoryMessage(`

        ⚔️ <b>SAVAŞ BAŞLADI!</b>

        <br><br>

        👹 <b>${escapeHTML(enemy.name)}</b>

        <br><br>

        ${escapeHTML(enemy.description)}

        <br><br>

        ❤️ Can:
        <b>${enemy.hp}/${enemy.maxHp}</b>

        <br>

        🛡️ Zırh:
        <b>${enemy.armor}</b>

        <br><br>

        <b>SALDIR</b> — Saldır

        <br>

        <b>İKSİR</b> — Şifa iksiri

        <br>

        <b>KAÇ</b> — Kaç

    `);

    updateAllUI();
}


function getPlayerWeapon() {

    if (!game.player.equippedWeapon) {
        return null;
    }

    return getInventoryItem(
        game.player.equippedWeapon
    );
}


function playerAttack() {

    const enemy =
        game.combat.enemy;

    if (!enemy) {
        return;
    }

    const d20 =
        randomInt(1, 20);

    const strMod =
        modifier(
            game.player.stats.strength
        );

    const attack =
        d20 + strMod;

    const weapon =
        getPlayerWeapon();

    const damageDice =
        weapon?.damage || "1d4";

    let damage = 0;

    let message = `

        ⚔️ <b>Saldırı!</b>

        <br><br>

        🎲 D20:
        <b>${d20}</b>

        <br>

        🎯 Saldırı:
        <b>${attack}</b>

        <br>

        🛡️ Düşman zırhı:
        <b>${enemy.armor}</b>

    `;

    if (d20 === 20) {

        damage =
            rollDice(damageDice) * 2;

        enemy.hp =
            Math.max(
                0,
                enemy.hp - damage
            );

        message += `

            <br><br>

            🎉 <b>KRİTİK VURUŞ!</b>

            <br>

            💥 Hasar:
            <b>${damage}</b>

        `;

    } else if (
        d20 !== 1 &&
        attack >= enemy.armor
    ) {

        damage =
            Math.max(
                1,
                rollDice(damageDice) +
                strMod
            );

        enemy.hp =
            Math.max(
                0,
                enemy.hp - damage
            );

        message += `

            <br><br>

            ⚔️ <b>VURUŞ!</b>

            <br>

            💥 Hasar:
            <b>${damage}</b>

        `;

    } else {

        message += `

            <br><br>

            ❌ <b>Iskaladın!</b>

        `;
    }

    message += `

        <br><br>

        👹 ${escapeHTML(enemy.name)}

        <br>

        ❤️ ${enemy.hp}/${enemy.maxHp}

    `;

    addStoryMessage(message);

    updateAllUI();

    if (enemy.hp <= 0) {

        winCombat();

        return;
    }

    enemyTurn();
}


function enemyTurn() {

    if (!game.combat.active) {
        return;
    }

    const enemy =
        game.combat.enemy;

    if (!enemy) {
        return;
    }

    game.combat.round++;

    const d20 =
        randomInt(1, 20);

    const defense =
        10 +
        modifier(
            game.player.stats.dexterity
        );

    const attack =
        d20 + enemy.attackBonus;

    let damage = 0;

    let message = `

        👹 <b>${escapeHTML(enemy.name)}</b>
        saldırıyor!

        <br><br>

        🎲 D20:
        <b>${d20}</b>

        <br>

        🎯 Saldırı:
        <b>${attack}</b>

        <br>

        🛡️ Savunman:
        <b>${defense}</b>

    `;

    if (d20 === 20) {

        damage =
            rollDice(enemy.damage) * 2;

        game.player.hp =
            Math.max(
                0,
                game.player.hp - damage
            );

        message += `

            <br><br>

            💀 <b>KRİTİK VURUŞ!</b>

            <br>

            💥 Hasar:
            <b>${damage}</b>

        `;

    } else if (
        d20 !== 1 &&
        attack >= defense
    ) {

        damage =
            rollDice(enemy.damage);

        game.player.hp =
            Math.max(
                0,
                game.player.hp - damage
            );

        message += `

            <br><br>

            🩸 <b>Vuruldun!</b>

            <br>

            💥 Hasar:
            <b>${damage}</b>

        `;

    } else {

        message += `

            <br><br>

            ❌ Düşman ıskaladı.

        `;
    }

    message += `

        <br><br>

        ❤️ Canın:
        <b>${game.player.hp}/${game.player.maxHp}</b>

    `;

    addStoryMessage(message);

    updateAllUI();

    if (game.player.hp <= 0) {
        loseCombat();
    }
}


function attemptFlee() {

    const roll =
        randomInt(1, 20);

    const dexMod =
        modifier(
            game.player.stats.dexterity
        );

    const total =
        roll + dexMod;

    if (total >= 12) {

        addStoryMessage(`

            🏃 <b>Kaçmayı başardın!</b>

            <br><br>

            🎲 Zar:
            ${roll}

        `);

        endCombat();

    } else {

        addStoryMessage(`

            ❌ <b>Kaçamadın!</b>

            <br><br>

            🎲 Zar:
            ${roll}

        `);

        enemyTurn();
    }
}


function endCombat() {

    game.combat.active = false;
    game.combat.enemy = null;
    game.combat.round = 0;

    updateAllUI();
}


function winCombat() {

    const enemy =
        game.combat.enemy;

    if (!enemy) {
        return;
    }

    game.player.xp +=
        enemy.xp;

    game.player.gold +=
        enemy.gold;

    addStoryMessage(`

        🎉 <b>ZAFER!</b>

        <br><br>

        👹 ${escapeHTML(enemy.name)}
        yenildi.

        <br><br>

        ✨ XP:
        <b>+${enemy.xp}</b>

        <br>

        💰 Altın:
        <b>+${enemy.gold}</b>

    `);

    showToast(
        `🎉 Zafer! +${enemy.xp} XP, +${enemy.gold} altın`
    );

    endCombat();

    checkLevelUp();

    updateAllUI();
}


function loseCombat() {

    const enemyName =
        game.combat.enemy?.name ||
        "Düşman";

    endCombat();

    game.player.hp =
        Math.max(
            1,
            Math.ceil(
                game.player.maxHp * .5
            )
        );

    game.world.location =
        "Blackmoor Köyü";

    addStoryMessage(`

        💀 <b>YERE YIĞILDIN!</b>

        <br><br>

        ${escapeHTML(enemyName)}
        seni yendi.

        <br><br>

        Ölümün bu maceranın sonu
        olmadı.

        <br><br>

        Blackmoor Köyü'nde
        gözlerini yeniden açıyorsun.

        <br><br>

        ❤️ Canın:
        <b>${game.player.hp}/${game.player.maxHp}</b>

    `);

    updateAllUI();
}


function handleCombatAction(action) {

    const lower =
        action.toLocaleLowerCase("tr-TR");

    if (
        lower.includes("iksir") ||
        lower.includes("şifa")
    ) {

        const potion =
            getInventoryItem("potion");

        if (!potion) {

            addStoryMessage(
                "🧪 Şifa iksirin yok."
            );

            return;
        }

        const healed =
            usePotion(potion);

        if (
            healed &&
            game.combat.active
        ) {
            enemyTurn();
        }

        return;
    }

    if (
        lower.includes("kaç") ||
        lower.includes("geri çek")
    ) {

        attemptFlee();

        return;
    }

    if (
        lower.includes("saldır") ||
        lower.includes("saldir") ||
        lower.includes("vur") ||
        lower.includes("kılıç") ||
        lower.includes("kilic") ||
        lower.includes("bıçak") ||
        lower.includes("bicak") ||
        lower.includes("büyü") ||
        lower.includes("buyu")
    ) {

        playerAttack();

        return;
    }

    addStoryMessage(`

        ⚔️ <b>Savaş devam ediyor.</b>

        <br><br>

        "saldır" — Düşmana saldır.

        <br>

        "iksir" — Şifa iksiri kullan.

        <br>

        "kaç" — Kaçmayı dene.

    `);
}


/* =========================================================
   NATURAL LANGUAGE
========================================================= */

function naturalLanguageAction(action) {

    const lower =
        action.toLocaleLowerCase("tr-TR");

    /* SAVAŞ */

    if (
        [
            "saldır",
            "saldir",
            "vur",
            "kes",
            "öldür",
            "oldur",
            "kılıcımı çek",
            "kilicimi cek"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        startCombat("shadowWolf");

        return;
    }


    /* İKSİR */

    if (
        [
            "iksir",
            "şifa iç",
            "sifa ic",
            "iksir iç",
            "iksir ic"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        const potion =
            getInventoryItem("potion");

        if (potion) {
            usePotion(potion);
        } else {
            addStoryMessage(
                "🧪 Şifa iksirin yok."
            );
        }

        return;
    }


    /* MEŞALE */

    if (
        [
            "meşale",
            "mesale",
            "ışık yak",
            "isik yak",
            "meşaleyi yak",
            "mesaleyi yak"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        const torch =
            getInventoryItem("torch");

        if (torch) {
            useTorch(torch);
        } else {
            addStoryMessage(
                "🔥 Meşalen yok."
            );
        }

        return;
    }


    /* KUYU */

    if (
        [
            "kuyu",
            "kuyunun",
            "kuyuya",
            "kuyuyu"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        game.story.flags.wellVisited =
            true;

        completeObjective(
            "blackmoorWhispers",
            "visitWell"
        );

        addStoryMessage(`

            🌑 Kuyunun taş kenarına
            yaklaşıyorsun.

            <br><br>

            Yağmur taşların üzerinden
            süzülüyor.

            <br><br>

            Kuyunun dibinden çok hafif
            bir fısıltı geliyor.

            <br><br>

            <i>"Beni bul..."</i>

            <br><br>

            Bir şeyin aşağıda hareket
            ettiğini hissediyorsun.

        `);

        return;
    }


    /* KİLİSE */

    if (
        [
            "kilise",
            "kiliseye",
            "kiliseyi"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        game.story.flags.churchVisited =
            true;

        game.world.location =
            "Terk Edilmiş Kilise";

        addStoryMessage(`

            ⛪ Terk edilmiş kiliseye
            ulaşıyorsun.

            <br><br>

            Kapı hafifçe açık.

            <br><br>

            İçeriden zayıf bir mum ışığı
            geliyor.

            <br><br>

            Kapının arkasından bir
            ayak sesi duyuluyor.

        `);

        updateAllUI();

        return;
    }


    /* ORMAN */

    if (
        [
            "orman",
            "ormana",
            "ağaç",
            "ağaçların",
            "agac",
            "agaclarin"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        game.world.location =
            "Blackmoor Ormanı";

        if (
            !game.story.discoveredLocations
                .includes("Blackmoor Ormanı")
        ) {

            game.story.discoveredLocations
                .push("Blackmoor Ormanı");
        }

        addStoryMessage(`

            🌲 Blackmoor Ormanı'na
            giriyorsun.

            <br><br>

            Köyün ışıkları arkanda
            kalıyor.

            <br><br>

            Ağaçların arasından
            sarı iki göz beliriyor.

            <br><br>

            👹 <b>Gölge Kurdu!</b>

        `);

        updateAllUI();

        startCombat("shadowWolf");

        return;
    }


    /* MARA */

    if (
        lower.includes("mara") ||
        lower.includes("şifacı") ||
        lower.includes("sifaci")
    ) {

        completeObjective(
            "missingVillager",
            "talkMara"
        );

        addStoryMessage(`

            🧑‍⚕️ Mara sana dikkatlice
            bakıyor.

            <br><br>

            <i>
            "Kardeşim birkaç gün önce
            kayboldu. Onu en son
            kilisenin yakınında gördüler."
            </i>

            <br><br>

            Gözlerinde korku var.

        `);

        return;
    }


    /* ARAŞTIRMA */

    if (
        [
            "araştır",
            "arastir",
            "incele",
            "kontrol et",
            "bak",
            "keşfet",
            "kesfet",
            "etrafa bak"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        game.story.flags.foundClue =
            true;

        completeObjective(
            "missingVillager",
            "findClue"
        );

        addStoryMessage(`

            🔎 Çevreyi dikkatlice
            araştırıyorsun.

            <br><br>

            Yağmur, taşların üzerindeki
            ayak izlerini silmeye başlamış.

            <br><br>

            Fakat çamurun içinde sana
            ait olmayan bir çift ayak izi
            fark ediyorsun.

            <br><br>

            İzler kiliseye doğru gidiyor.

        `);

        return;
    }


    /* KUYU SIRRI */

    if (
        lower.includes("fısıltı") ||
        lower.includes("fisilti") ||
        lower.includes("sesi dinle") ||
        lower.includes("dinliyorum")
    ) {

        if (game.story.flags.wellVisited) {

            game.story.flags.wellSecret =
                true;

            completeObjective(
                "blackmoorWhispers",
                "learnSecret"
            );

            addStoryMessage(`

                👂 Kuyunun içine
                dikkatlice kulak veriyorsun.

                <br><br>

                Fısıltı bu kez daha net.

                <br><br>

                <i>
                "Kilise... altında..."
                </i>

                <br><br>

                Sonra her şey sessizleşiyor.

            `);

        } else {

            addStoryMessage(
                "Önce köy kuyusunu bulmalısın."
            );
        }

        return;
    }


    /* KONUŞMA */

    if (
        [
            "konuş",
            "konus",
            "sor",
            "seslen"
        ].some(word =>
            lower.includes(word)
        )
    ) {

        addStoryMessage(`

            🧑 Bir köylü sana bakıyor.

            <br><br>

            <i>
            "Bu gece burada fazla
            dolaşma..."
            </i>

        `);

        return;
    }


    /* VARSAYILAN */

    const responses = [

        "Etrafı dikkatlice gözlemliyorsun. Karanlıkta henüz fark etmediğin bir şey olduğunu hissediyorsun.",

        "Hamlen çevrede küçük bir değişikliğe neden oluyor. Uzaklardan metalik bir ses duyuluyor.",

        "Bir süre sessizlik oluyor. Sonra yağmurun arasından belirsiz bir fısıltı duyuyorsun.",

        "İçgüdülerin burada daha derin bir sırrın olduğunu söylüyor.",

        "Blackmoor'un gecesi seni izliyormuş gibi hissettiriyor."

    ];

    addStoryMessage(
        responses[
            randomInt(
                0,
                responses.length - 1
            )
        ]
    );
}


/* =========================================================
   PLAYER ACTION
========================================================= */

function playerAction() {

    const input =
        $("playerInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addStoryMessage(
        escapeHTML(text),
        "player"
    );

    game.story.actions.push({

        text,

        location:
            game.world.location,

        timestamp:
            new Date().toISOString()

    });

    input.value = "";

    if (game.combat.active) {

        handleCombatAction(text);

        return;
    }

    naturalLanguageAction(text);
}


/* =========================================================
   D20
========================================================= */

function rollD20() {

    const result =
        randomInt(1, 20);

    $("diceResult").textContent =
        result;

    if (result === 20) {

        addStoryMessage(
            "🎉 <b>Kritik başarı!</b> D20 sonucu 20."
        );

    } else if (result === 1) {

        addStoryMessage(
            "💀 <b>Kritik başarısızlık!</b> D20 sonucu 1."
        );

    } else {

        addStoryMessage(
            `🎲 D20 sonucu: <b>${result}</b>`
        );
    }
}


/* =========================================================
   LEVEL UP
========================================================= */

function checkLevelUp() {

    let required =
        game.player.level * 100;

    while (
        game.player.xp >= required
    ) {

        game.player.xp -= required;

        game.player.level++;

        game.player.maxHp += 5;

        game.player.hp =
            game.player.maxHp;

        addStoryMessage(`

            🌟 <b>SEVİYE ATLADIN!</b>

            <br><br>

            ⭐ Yeni seviye:
            <b>${game.player.level}</b>

            <br><br>

            ❤️ Maksimum canın +5 arttı.

        `);

        showToast(
            `🌟 Seviye ${game.player.level}!`
        );

        required =
            game.player.level * 100;
    }
}


/* =========================================================
   CHARACTER CREATION
========================================================= */

function createCharacter() {

    const name =
        $("nameInput")
            .value
            .trim();

    if (!name) {

        alert(
            "Karakterine bir isim vermelisin."
        );

        return;
    }

    const race =
        $("raceInput").value;

    const className =
        $("classInput").value;

    const background =
        $("backgroundInput").value;

    const base =
        CLASS_STATS[className];

    const bonus =
        RACE_BONUSES[race] || {};

    const stats = {};

    Object.keys(base)
        .filter(
            key => key !== "maxHp"
        )
        .forEach(stat => {

            stats[stat] =
                base[stat] +
                Number(bonus[stat] || 0);

        });

    game.player = {

        name,

        race,

        className,

        background,

        level: 1,

        xp: 0,

        hp: base.maxHp,

        maxHp: base.maxHp,

        gold: 25,

        stats,

        inventory:
            clone(DEFAULT_PLAYER.inventory),

        equippedWeapon: null

    };

    game.world.location =
        "Blackmoor Köyü";

    game.story =
        {

            chapter: 1,

            actions: [],

            flags: {},

            discoveredLocations: []

        };

    game.combat =
        {

            active: false,

            enemy: null,

            round: 0

        };

    initializeQuests();

    $("characterModal")
        .classList.add("hidden");

    $("story").innerHTML = "";

    addStoryMessage(`

        ⚔️ <b>Yeni karakter oluşturuldu!</b>

        <br><br>

        <b>${escapeHTML(name)}</b>,
        Realm of Shadows dünyasına
        adım atıyor.

        <br><br>

        Irk:
        <b>${escapeHTML(race)}</b>

        <br>

        Sınıf:
        <b>${escapeHTML(className)}</b>

        <br>

        Geçmiş:
        <b>${escapeHTML(background)}</b>

        <br><br>

        Yağmur altında Blackmoor Köyü
        seni bekliyor.

    `);

    updateAllUI();

    showToast(
        "⚔️ Yeni karakter oluşturuldu!"
    );
}


/* =========================================================
   SAVE
========================================================= */

function saveGame() {

    try {

        localStorage.setItem(
            "realmOfShadowsSave",
            JSON.stringify(game)
        );

        addStoryMessage(
            "💾 <b>Oyun başarıyla kaydedildi.</b>"
        );

        showToast(
            "💾 Oyun kaydedildi."
        );

    } catch (error) {

        console.error(error);

        addStoryMessage(
            "❌ Oyun kaydedilirken hata oluştu."
        );
    }
}


/* =========================================================
   LOAD
========================================================= */

function loadGame() {

    const saved =
        localStorage.getItem(
            "realmOfShadowsSave"
        );

    if (!saved) {

        addStoryMessage(
            "📂 Kaydedilmiş oyun bulunamadı."
        );

        return;
    }

    try {

        const data =
            JSON.parse(saved);

        if (data.player) {
            game.player =
                data.player;
        }

        if (data.world) {
            game.world =
                data.world;
        }

        if (data.story) {
            game.story =
                data.story;
        }

        game.quests =
            data.quests || [];

        game.npcs =
            data.npcs || [];

        game.combat =
            data.combat || {

                active: false,
                enemy: null,
                round: 0

            };

        updateAllUI();

        addStoryMessage(
            "📂 <b>Kaydedilmiş macera yüklendi.</b>"
        );

        showToast(
            "📂 Oyun yüklendi."
        );

    } catch (error) {

        console.error(error);

        addStoryMessage(
            "❌ Kayıt dosyası bozuk veya okunamıyor."
        );
    }
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame() {

    const confirmed =
        confirm(
            "Yeni oyun başlatılsın mı? Mevcut ilerleme silinecek."
        );

    if (!confirmed) {
        return;
    }

    localStorage.removeItem(
        "realmOfShadowsSave"
    );

    game.player =
        clone(DEFAULT_PLAYER);

    game.world = {

        location: "Blackmoor Köyü",

        weather: "Yağmurlu",

        time: "Gece",

        danger: 1

    };

    game.story = {

        chapter: 1,

        actions: [],

        flags: {},

        discoveredLocations: []

    };

    game.combat = {

        active: false,

        enemy: null,

        round: 0

    };

    initializeQuests();
    initializeNPCs();

    $("story").innerHTML = "";

    showIntro();

    updateAllUI();

    showToast(
        "🔄 Yeni oyun başladı."
    );
}


/* =========================================================
   COMBAT UI
========================================================= */

function updateCombatUI() {

    const container =
        $("combatStatus");

    container.innerHTML = "";

    if (!game.combat.active) {
        return;
    }

    const enemy =
        game.combat.enemy;

    if (!enemy) {
        return;
    }

    container.className =
        "combat-status";

    container.innerHTML = `

        <div class="combat-status-title">
            ⚔️ SAVAŞ
        </div>

        <div>
            👹 <strong>
                ${escapeHTML(enemy.name)}
            </strong>
        </div>

        <div>
            ❤️ ${enemy.hp}/${enemy.maxHp}
        </div>

        <div>
            🔄 Tur:
            ${game.combat.round}
        </div>

    `;
}


/* =========================================================
   UPDATE ALL UI
========================================================= */

function updateAllUI() {

    $("location").textContent =
        game.world.location;

    updateCharacterUI();

    updateInventoryUI();

    updateQuestUI();

    updateCombatUI();
}

/* =========================================================
   MODAL EVENTS
========================================================= */

$("characterButton")
    .addEventListener(
        "click",
        showCharacterModal
    );


$("closeCharacter")
    .addEventListener(
        "click",
        () => {

            $("characterModal")
                .classList.add("hidden");

        }
    );


$("inventoryButton")
    .addEventListener(
        "click",
        () => {

            updateInventoryUI();

            $("inventoryModal")
                .classList.remove("hidden");

        }
    );


$("closeInventory")
    .addEventListener(
        "click",
        () => {

            $("inventoryModal")
                .classList.add("hidden");

        }
    );


$("characterModal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("characterModal")
            ) {

                $("characterModal")
                    .classList.add("hidden");

            }

        }
    );


$("inventoryModal")
    .addEventListener(
        "click",
        event => {

            if (
                event.target ===
                $("inventoryModal")
            ) {

                $("inventoryModal")
                    .classList.add("hidden");

            }

        }
    );


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            $("characterModal")
                .classList.add("hidden");

            $("inventoryModal")
                .classList.add("hidden");
        }

    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

$("actionButton")
    .addEventListener(
        "click",
        playerAction
    );


$("playerInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                playerAction();
            }

        }
    );


$("saveButton")
    .addEventListener(
        "click",
        saveGame
    );


$("loadButton")
    .addEventListener(
        "click",
        loadGame
    );


$("newGameButton")
    .addEventListener(
        "click",
        newGame
    );


$("rollButton")
    .addEventListener(
        "click",
        rollD20
    );


$("createCharacter")
    .addEventListener(
        "click",
        createCharacter
    );


/* =========================================================
   START
========================================================= */

initializeNPCs();

initializeQuests();

showIntro();

updateAllUI();

console.log(
    "✅ Realm of Shadows hazır."
);
</script>
