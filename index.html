<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Realm of Shadows</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#090b12;
    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#game{min-height:100vh}

.topbar{
    min-height:70px;
    padding:12px 20px;
    background:#111522;
    border-bottom:1px solid #30374b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}
.logo{
    color:#d9b86c;
    font-size:22px;
    font-weight:bold;
}
.top-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.top-buttons button{
    background:#1b2130;
    color:#eee;
    border:1px solid #394158;
    padding:9px 13px;
    border-radius:8px;
}
.top-buttons button:hover{
    background:#2a3247;
    border-color:#bd9348;
}

.game-layout{
    display:grid;
    grid-template-columns:250px minmax(400px,1fr) 280px;
    gap:15px;
    max-width:1500px;
    margin:auto;
    padding:15px;
}

.left-panel,.right-panel{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.character-card,.stats-card,.side-card{
    background:#111522;
    border:1px solid #30374b;
    border-radius:12px;
    padding:16px;
}

.character-card{text-align:center}
.avatar{
    width:80px;
    height:80px;
    margin:auto;
    display:grid;
    place-items:center;
    background:#1c2334;
    border:1px solid #444e69;
    border-radius:50%;
    font-size:42px;
}
.character-card h2{
    margin:10px 0 4px;
}
.character-card p{
    color:#aaa;
    margin:0;
}

.stats-card h3,.side-card h3{
    margin-top:0;
    color:#d9b86c;
}

.stat,.ability{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #242a39;
}
.stat:last-child,.ability:last-child{border-bottom:0}

.story-panel{
    min-height:700px;
    background:#10131d;
    border:1px solid #30374b;
    border-radius:12px;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.location{
    background:#181d2a;
    border:1px solid #343c53;
    border-radius:9px;
    padding:12px;
    margin-bottom:12px;
}
.location-label{
    color:#999;
    font-size:13px;
    margin-bottom:4px;
}
#location{color:#e4c77d}

.story{
    flex:1;
    overflow-y:auto;
    min-height:450px;
    max-height:650px;
    padding:5px;
}

.story-message{
    padding:12px 14px;
    margin-bottom:12px;
    border-radius:10px;
    line-height:1.6;
}
.story-message.dm{
    background:#171c29;
    border-left:3px solid #bd9348;
}
.story-message.player{
    background:#182332;
    border-left:3px solid #527aa5;
}
.message-author{
    font-size:12px;
    color:#caa968;
    font-weight:bold;
    margin-bottom:4px;
}

.action-area{
    margin-top:12px;
}
#playerInput{
    width:100%;
    resize:vertical;
    min-height:75px;
    padding:12px;
    background:#0b0e16;
    color:#eee;
    border:1px solid #394158;
    border-radius:9px;
    outline:none;
}
#playerInput:focus{
    border-color:#bd9348;
}
.action-button{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#8d672f;
    color:white;
    font-weight:bold;
}
.action-button:hover{background:#a87c38}

.side-card-header,.modal-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.item-count{
    background:#8d672f;
    border-radius:20px;
    padding:3px 9px;
    font-size:12px;
}

.quest-item{
    padding:10px;
    margin-bottom:9px;
    background:#181d2a;
    border-radius:8px;
}
.quest-item p{
    color:#aaa;
    font-size:13px;
}
.quest-item ul{
    padding-left:20px;
    font-size:13px;
}
.quest-item small{color:#d9b86c}

.dice-card{text-align:center}
.dice-result{
    height:70px;
    display:grid;
    place-items:center;
    font-size:38px;
    font-weight:bold;
    color:#d9b86c;
}
.dice-button{
    width:100%;
    padding:10px;
    background:#252c3d;
    color:#fff;
    border:1px solid #414b65;
    border-radius:8px;
}

.inventory-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}
.inventory-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    background:#171c29;
    border:1px solid #30374b;
    border-radius:9px;
}
.inventory-item-icon{font-size:27px}
.inventory-item-info{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:3px;
}
.inventory-item-info span{
    font-size:12px;
    color:#999;
}
.inventory-item-info .equipped{
    color:#78d68c;
}
.inventory-use-button{
    background:#252d40;
    color:white;
    border:1px solid #414b65;
    border-radius:7px;
    padding:8px 10px;
}
.inventory-use-button:hover{
    background:#34405a;
}

.combat-status{
    margin-top:10px;
    padding:12px;
    background:#241719;
    border:1px solid #7d3939;
    border-radius:9px;
    display:flex;
    justify-content:space-around;
    gap:10px;
    flex-wrap:wrap;
}
.combat-status-title{
    color:#e66a6a;
    font-weight:bold;
}

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.75);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.modal.hidden{display:none}
.modal-content{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111522;
    border:1px solid #414b65;
    border-radius:13px;
    padding:22px;
    position:relative;
}
.close{
    position:absolute;
    right:12px;
    top:10px;
    border:0;
    background:transparent;
    color:#aaa;
    font-size:30px;
}
.close:hover{color:white}
.modal-content label{
    display:block;
    margin:12px 0 5px;
    color:#bbb;
}
.modal-content input,
.modal-content select{
    width:100%;
    padding:10px;
    background:#0b0e16;
    color:#eee;
    border:1px solid #394158;
    border-radius:7px;
}
.character-info{
    line-height:1.6;
}
.empty{
    color:#888;
    text-align:center;
}

@media(max-width:1050px){
    .game-layout{
        grid-template-columns:220px 1fr;
    }
    .right-panel{
        grid-column:1/-1;
        display:grid;
        grid-template-columns:1fr 1fr;
    }
}
@media(max-width:750px){
    .topbar{
        flex-direction:column;
        align-items:stretch;
    }
    .top-buttons{
        justify-content:center;
    }
    .game-layout{
        grid-template-columns:1fr;
    }
    .right-panel{
        grid-column:auto;
        display:flex;
    }
}
</style>
</head>

<body>

<div id="game">

<header class="topbar">
    <div class="logo">⚔️ Realm of Shadows</div>

    <div class="top-buttons">
        <button id="characterButton">🧙 Karakter</button>
        <button id="inventoryButton">🎒 Envanter</button>
        <button id="saveButton">💾 Kaydet</button>
        <button id="loadButton">📂 Yükle</button>
    </div>
</header>

<main class="game-layout">

<aside class="left-panel">

<section class="character-card">
    <div class="avatar">🧙</div>
    <h2 id="characterName">Arden</h2>
    <p id="characterClass">İnsan Savaşçı</p>
</section>

<section class="stats-card">
<h3>Karakter</h3>

<div class="stat"><span>❤️ Can</span><strong id="hp">20 / 20</strong></div>
<div class="stat"><span>⭐ Seviye</span><strong id="level">1</strong></div>
<div class="stat"><span>✨ XP</span><strong id="xp">0</strong></div>
<div class="stat"><span>💰 Altın</span><strong id="gold">25</strong></div>
</section>

<section class="stats-card">
<h3>Özellikler</h3>

<div class="ability"><span>⚔️ Güç</span><strong id="strength">16</strong></div>
<div class="ability"><span>🏹 Çeviklik</span><strong id="dexterity">12</strong></div>
<div class="ability"><span>🛡️ Dayanıklılık</span><strong id="constitution">15</strong></div>
<div class="ability"><span>🧠 Zeka</span><strong id="intelligence">10</strong></div>
<div class="ability"><span>👁️ Bilgelik</span><strong id="wisdom">11</strong></div>
<div class="ability"><span>🗣️ Karizma</span><strong id="charisma">10</strong></div>
</section>

</aside>

<section class="story-panel">

<div class="location">
    <div class="location-label">📍 Konum</div>
    <strong id="location">Blackmoor Köyü</strong>
</div>

<div id="story" class="story"></div>

<div class="action-area">
<textarea
id="playerInput"
rows="3"
placeholder="Karakterinin ne yaptığını yaz... Örn: Kılıcımı çekip kurda saldırıyorum."
></textarea>

<button id="actionButton" class="action-button">
⚔️ Eylemi Gerçekleştir
</button>
</div>

</section>

<aside class="right-panel">

<section class="side-card">

<div class="side-card-header">
<h3>📜 Görevler</h3>
<span id="questCount" class="item-count">0</span>
</div>

<div id="quests">
<p class="empty">Görevler yükleniyor...</p>
</div>

</section>

<section class="side-card dice-card">
<h3>🎲 Zar</h3>
<div id="diceResult" class="dice-result">-</div>
<button id="rollButton" class="dice-button">🎲 D20 At</button>
</section>

</aside>

</main>
</div>

<!-- KARAKTER MODALI -->

<div id="characterModal" class="modal hidden">
<div class="modal-content">

<button id="closeCharacter" class="close">×</button>

<h2>🧙 Karakter</h2>

<div id="characterInfo" class="character-info"></div>

<hr>

<h3>Yeni Karakter</h3>

<label for="nameInput">Karakter Adı</label>
<input id="nameInput" maxlength="30" placeholder="Örn. Arden">

<label for="raceInput">Irk</label>
<select id="raceInput">
<option>İnsan</option>
<option>Elf</option>
<option>Cüce</option>
<option>Buçukluk</option>
<option>Yarı-Ork</option>
</select>

<label for="classInput">Sınıf</label>
<select id="classInput">
<option>Savaşçı</option>
<option>Büyücü</option>
<option>Hırsız</option>
<option>Paladin</option>
<option>Korucu</option>
</select>

<label for="backgroundInput">Geçmiş</label>
<select id="backgroundInput">
<option>Gezgin</option>
<option>Asker</option>
<option>Suçlu</option>
<option>Bilgin</option>
<option>Soylu</option>
</select>

<button id="createCharacter" class="action-button">
⚔️ Karakteri Oluştur
</button>

</div>
</div>

<!-- ENVANTER MODALI -->

<div id="inventoryModal" class="modal hidden">
<div class="modal-content">

<button id="closeInventory" class="close">×</button>

<div class="modal-title">
<h2>🎒 Envanter</h2>
<span id="inventoryCount" class="item-count">0</span>
</div>

<div id="inventory" class="inventory-list"></div>

</div>
</div>

<script>

/* =========================================================
   REALM OF SHADOWS
   TEK DOSYA SÜRÜMÜ
========================================================= */

const game = {

player:{
name:"Arden",
race:"İnsan",
className:"Savaşçı",
background:"Gezgin",

level:1,
xp:0,

hp:20,
maxHp:20,

stats:{
strength:16,
dexterity:12,
constitution:15,
intelligence:10,
wisdom:11,
charisma:10
},

inventory:[
{
id:"rusty_sword",
name:"Paslı Kılıç",
type:"weapon",
damage:"1d8",
quantity:1,
equipped:false
},
{
id:"potion",
name:"Şifa İksiri",
type:"consumable",
quantity:2,
heal:10
},
{
id:"torch",
name:"Meşale",
type:"utility",
quantity:3
}
],

equippedWeapon:null,
gold:25
},

world:{
name:"Realm of Shadows",
location:"Blackmoor Köyü",
weather:"Yağmurlu",
time:"Gece",
danger:1,
season:"Sonbahar",
torchActive:false
},

npcs:[],
quests:[],
factions:[],
locations:[],

story:{
chapter:1,
scene:"Blackmoor Köyü",
actions:[],
events:[],
flags:{},
discoveredLocations:[],
discoveredSecrets:[],
relationships:{}
},

combat:{
active:false,
enemy:null,
round:0
},

ai:{
lastResponse:null,
history:[]
}

};


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const playerInput=$("playerInput");
const actionButton=$("actionButton");
const story=$("story");


/* =========================================================
   GÜVENLİ HTML
========================================================= */

function escapeHTML(text){

const div=document.createElement("div");
div.textContent=String(text);
return div.innerHTML;

}


/* =========================================================
   HİKAYE MESAJI
========================================================= */

function addStoryMessage(text,type="dm"){

const message=document.createElement("div");
message.className=`story-message ${type}`;

const author=document.createElement("div");
author.className="message-author";

author.textContent=
type==="player"
?game.player.name
:"🎲 Dungeon Master";

const content=document.createElement("p");
content.innerHTML=text;

message.append(author,content);
story.appendChild(message);

story.scrollTop=story.scrollHeight;

}


/* =========================================================
   ENVANTER
========================================================= */

function getInventoryItem(id){

return game.player.inventory.find(
item=>item.id===id
);

}


function updateInventoryUI(){

const panel=$("inventory");

if(!panel)return;

panel.innerHTML="";

const inventory=game.player.inventory;

$("inventoryCount").textContent=
inventory.reduce(
(total,item)=>total+(item.quantity||0),0
);

if(!inventory.length){

panel.innerHTML=
`<p class="empty">Envanter boş.</p>`;

return;

}

inventory.forEach(item=>{

let icon="📦";

if(item.type==="weapon")icon="⚔️";
if(item.type==="consumable")icon="🧪";
if(item.type==="utility")icon="🔥";

let action="Kullan";

if(item.type==="weapon")
action=item.equipped?"Bırak":"Kuşan";

if(item.type==="utility")
action=game.world.torchActive?"Söndür":"Yak";

const element=document.createElement("div");

element.className="inventory-item";

element.innerHTML=`

<div class="inventory-item-icon">${icon}</div>

<div class="inventory-item-info">

<strong>${escapeHTML(item.name)}</strong>

<span>Adet: ${item.quantity}</span>

${item.damage?
`<span>Hasar: ${escapeHTML(item.damage)}</span>`:""}

${item.equipped?
`<span class="equipped">⚔️ Kuşanılmış</span>`:""}

</div>

<button
class="inventory-use-button"
data-id="${escapeHTML(item.id)}"
>${action}</button>
`;

element
.querySelector(".inventory-use-button")
.addEventListener("click",()=>{
useInventoryItem(item.id)
});

panel.appendChild(element);

});

}


function useInventoryItem(id){

const item=getInventoryItem(id);

if(!item)return;

if(item.type==="weapon"){
toggleWeapon(item);
return;
}

if(item.type==="consumable"){
usePotion(item);
return;
}

if(item.type==="utility"){
useTorch(item);
}

}


function toggleWeapon(item){

if(item.equipped){

item.equipped=false;
game.player.equippedWeapon=null;

addStoryMessage(
`⚔️ ${escapeHTML(item.name)} kuşandan çıkarıldı.`
);

}else{

game.player.inventory.forEach(
other=>{
if(other.type==="weapon")
other.equipped=false;
}
);

item.equipped=true;
game.player.equippedWeapon=item.id;

addStoryMessage(
`⚔️ <b>${escapeHTML(item.name)}</b> kuşandın.`
);

}

updateInventoryUI();

}


function usePotion(item){

if(game.player.hp>=game.player.maxHp){

addStoryMessage("❤️ Canın zaten tamamen dolu.");
return;

}

const old=game.player.hp;

game.player.hp=Math.min(
game.player.maxHp,
game.player.hp+(item.heal||10)
);

const healed=game.player.hp-old;

item.quantity--;

addStoryMessage(`
🧪 Şifa İksiri kullandın.
<br><br>
❤️ <b>${healed}</b> can yenilendi.
<br>
Can: <b>${game.player.hp}/${game.player.maxHp}</b>
`);

removeEmptyItems();
updateAllUI();

}


function useTorch(item){

if(game.world.torchActive){

game.world.torchActive=false;

addStoryMessage("🔥 Meşaleyi söndürdün.");

}else{

if(item.quantity<=0){

addStoryMessage("🔥 Kullanılabilir meşalen yok.");
return;

}

item.quantity--;
game.world.torchActive=true;

addStoryMessage(`
🔥 Meşaleyi yaktın.
<br><br>
Karanlık çevre artık daha görünür.
`);

removeEmptyItems();

}

updateInventoryUI();

}


function removeEmptyItems(){

game.player.inventory=
game.player.inventory.filter(
item=>item.quantity>0
);

}


/* =========================================================
   KARAKTER
========================================================= */

function updateCharacterUI(){

$("characterName").textContent=
game.player.name;

$("characterClass").textContent=
`${game.player.race} ${game.player.className}`;

$("hp").textContent=
`${game.player.hp} / ${game.player.maxHp}`;

$("level").textContent=game.player.level;
$("xp").textContent=game.player.xp;
$("gold").textContent=game.player.gold;

for(const stat in game.player.stats){

$(stat).textContent=
game.player.stats[stat];

}

}


function showCharacter(){

$("characterInfo").innerHTML=`

<p><strong>İsim:</strong> ${escapeHTML(game.player.name)}</p>
<p><strong>Irk:</strong> ${escapeHTML(game.player.race)}</p>
<p><strong>Sınıf:</strong> ${escapeHTML(game.player.className)}</p>
<p><strong>Geçmiş:</strong> ${escapeHTML(game.player.background)}</p>

<hr>

<p><strong>Seviye:</strong> ${game.player.level}</p>
<p><strong>XP:</strong> ${game.player.xp}</p>
<p><strong>Can:</strong> ${game.player.hp}/${game.player.maxHp}</p>
<p><strong>Altın:</strong> ${game.player.gold}</p>

<p><strong>Silah:</strong>
${
game.player.equippedWeapon
?escapeHTML(
getInventoryItem(
game.player.equippedWeapon
)?.name||"Yok"
)
:"Yok"
}
</p>

`;

$("characterModal").classList.remove("hidden");

}


/* =========================================================
   GÖREVLER
========================================================= */

function createQuest(data){

if(game.quests.some(q=>q.id===data.id))
return;

game.quests.push({

id:data.id,
title:data.title,
description:data.description,

objectives:data.objectives.map(o=>({
...o,
completed:false
})),

reward:data.reward,
status:"active"

});

}


function initializeQuests(){

createQuest({

id:"blackmoor_whispers",

title:"Blackmoor'un Fısıltıları",

description:
"Köy kuyusundan gelen gizemli seslerin kaynağını araştır.",

objectives:[
{id:"visit_well",text:"Köy kuyusunu araştır."},
{id:"learn_secret",text:"Kuyunun sırrı hakkında bilgi edin."}
],

reward:100

});


createQuest({

id:"missing_person",

title:"Kayıp Köylü",

description:
"Blackmoor'da kaybolan kişinin izini araştır.",

objectives:[
{id:"talk_healer",text:"Mara ile konuş."},
{id:"find_clue",text:"Kaybolan kişiye ait bir ipucu bul."}
],

reward:150

});

}


function completeQuestObjective(questId,objectiveId){

const quest=game.quests.find(q=>q.id===questId);

if(!quest)return;

const objective=
quest.objectives.find(
o=>o.id===objectiveId
);

if(!objective||objective.completed)return;

objective.completed=true;

if(
quest.objectives.every(o=>o.completed)
){

quest.status="completed";

game.player.gold+=quest.reward;

addStoryMessage(`
🎉 <b>Görev tamamlandı!</b>
<br><br>
${escapeHTML(quest.title)}
<br>
💰 ${quest.reward} altın kazandın.
`);

}

updateQuestUI();
updateCharacterUI();

}


function updateQuestUI(){

const panel=$("quests");

panel.innerHTML="";

const active=
game.quests.filter(
q=>q.status==="active"
);

$("questCount").textContent=active.length;

if(!active.length){

panel.innerHTML=
`<p class="empty">Aktif görev yok.</p>`;

return;

}

active.forEach(quest=>{

const completed=
quest.objectives.filter(
o=>o.completed
).length;

const element=document.createElement("div");

element.className="quest-item";

element.innerHTML=`

<strong>📜 ${escapeHTML(quest.title)}</strong>

<p>${escapeHTML(quest.description)}</p>

<div>
İlerleme:
${completed}/${quest.objectives.length}
</div>

<ul>

${quest.objectives.map(o=>`

<li>
${o.completed?"✅":"⬜"}
${escapeHTML(o.text)}
</li>

`).join("")}

</ul>

<small>Ödül: ${quest.reward} altın</small>
`;

panel.appendChild(element);

});

}


/* =========================================================
   NPC
========================================================= */

function initializeNPCs(){

game.npcs=[

{
id:"elder_jonas",
name:"Jonas",

   ZAR
========================================================= */

function rollDice(notation){

const match=String(notation).match(
/^(\d+)d(\d+)$/
);

if(!match)return 0;

let total=0;

for(
let i=0;
i<Number(match[1]);
i++
){

total+=
Math.floor(
Math.random()*Number(match[2])
)+1;

}

return total;

}


function modifier(stat){

return Math.floor((stat-10)/2);

}

function startCombat(enemyId="shadow_wolf"){

if(game.combat.active){

addStoryMessage("⚔️ Zaten savaştasın.");
return;

}

const template=enemies[enemyId];

if(!template)return;

game.combat.active=true;
game.combat.round=1;

game.combat.enemy={
id:enemyId,
...template
};

addStoryMessage(`

⚔️ <b>SAVAŞ BAŞLADI!</b>

<br><br>

👹 <b>${escapeHTML(template.name)}</b>

<br>

${escapeHTML(template.description)}

<b>${template.hp}/${template.maxHp}</b>

<br>

🛡️ Zırh:
<b>${template.armor}</b>

<br><br>

<b>Saldırmak için "saldır" yaz.</b>

<br>

`);

}


function playerAttack(){

const enemy=game.combat.enemy;

const d20=
Math.floor(Math.random()*20)+1;

const strMod=
modifier(game.player.stats.strength);

const weapon=
game.player.equippedWeapon
?getInventoryItem(
game.player.equippedWeapon
)
:null;

const attack=d20+strMod;

let damage=0;

let text=`

⚔️ <b>Saldırı!</b>

<br>

🎲 D20:
<b>${d20}</b>

<br>

🎯 Toplam:
<b>${attack}</b>

<br>

🛡️ Düşman zırhı:
<b>${enemy.armor}</b>
`;

if(d20===20){

damage=
rollDice(
weapon?.damage||"1d4"
)*2;

enemy.hp=Math.max(
0,
enemy.hp-damage
);

text+=`

<br><br>
🎉 <b>KRİTİK VURUŞ!</b>
<br>
💥 Hasar: <b>${damage}</b>
`;

}else if(d20!==1 && attack>=enemy.armor){

damage=Math.max(
1,
rollDice(
weapon?.damage||"1d4"
)+strMod
);

enemy.hp=Math.max(
0,
enemy.hp-damage
);

text+=`

<br><br>
⚔️ <b>VURUŞ!</b>
<br>
💥 Hasar: <b>${damage}</b>
`;

}else{

text+=`
<br><br>
❌ <b>Iskaladın!</b>
`;

}

text+=`

<br><br>

👹 ${escapeHTML(enemy.name)}
<br>
❤️ ${enemy.hp}/${enemy.maxHp}
`;

addStoryMessage(text);

if(enemy.hp<=0){

winCombat();
return;

}

enemyTurn();

}


function enemyTurn(){

if(!game.combat.active)return;

const enemy=game.combat.enemy;

game.combat.round++;

const d20=
Math.floor(Math.random()*20)+1;

const defense=
10+
modifier(game.player.stats.dexterity);

const attack=
d20+enemy.attackBonus;

let damage=0;

let text=`

👹 <b>${escapeHTML(enemy.name)}</b>
saldırıyor!

<br><br>

🎲 D20: <b>${d20}</b>

<br>

🎯 Saldırı: <b>${attack}</b>

<br>

🛡️ Savunman: <b>${defense}</b>
`;

if(d20===20){

damage=rollDice(enemy.damage)*2;

game.player.hp=Math.max(
0,
game.player.hp-damage
);

text+=`
<br><br>
💀 <b>KRİTİK VURUŞ!</b>
<br>
💥 Hasar: <b>${damage}</b>
`;

}else if(attack>=defense){

damage=rollDice(enemy.damage);

game.player.hp=Math.max(
0,
game.player.hp-damage
);

text+=`
<br><br>
🩸 <b>Vuruldun!</b>
<br>
💥 Hasar: <b>${damage}</b>
`;

}else{

text+=`
<br><br>
❌ Düşman ıskaladı.
`;

}

text+=`
<br><br>
❤️ Canın:
<b>${game.player.hp}/${game.player.maxHp}</b>
`;

addStoryMessage(text);

updateAllUI();

if(game.player.hp<=0)
loseCombat();

}


function attemptFlee(){

const roll=
Math.floor(Math.random()*20)+1;

const dex=modifier(
game.player.stats.dexterity
);

if(roll+dex>=12){

addStoryMessage(`
🏃 <b>Kaçmayı başardın!</b>
<br><br>
🎲 D20: ${roll}
`);

game.combat.active=false;
game.combat.enemy=null;
game.combat.round=0;

updateAllUI();

}else{

addStoryMessage(`
❌ Kaçamadın!
<br><br>
🎲 D20: ${roll}
`);

enemyTurn();

}

}


function winCombat(){

const enemy=game.combat.enemy;

game.player.xp+=enemy.xp;
game.player.gold+=enemy.gold;

addStoryMessage(`
🎉 <b>ZAFER!</b>

<br><br>

👹 ${escapeHTML(enemy.name)} yenildi.

<br><br>

✨ XP:
<b>+${enemy.xp}</b>

<br>

💰 Altın:
<b>+${enemy.gold}</b>
`);

game.combat.active=false;
game.combat.enemy=null;
game.combat.round=0;

checkLevelUp();
updateAllUI();

}


function loseCombat(){

const name=
game.combat.enemy?.name||"Düşman";

game.combat.active=false;
game.combat.enemy=null;
game.combat.round=0;

function handleCombatAction(action){

const lower=action.toLowerCase();

if(
lower.includes("iksir")||
lower.includes("şifa")
){

const potion=getInventoryItem("potion");

if(potion)
usePotion(potion);
else
addStoryMessage("🧪 Şifa iksirin yok.");

if(game.combat.active)
enemyTurn();

return;

}

if(
lower.includes("kaç")||
lower.includes("geri çek")
){

attemptFlee();
return;

}

if(
lower.includes("saldır")||
lower.includes("vur")||
lower.includes("kılıç")||
lower.includes("bıçak")||
lower.includes("büyü")
){

playerAttack();
return;

}

addStoryMessage(`

⚔️ Savaş devam ediyor.

<br><br>

Ne yapmak istiyorsun?

<br>

<b>"saldır"</b> — Düşmana saldır.

<br>

<b>"iksir kullan"</b> — Şifa iksiri kullan.

<br>

<b>"kaç"</b> — Kaçmayı dene.

`);

}

);

}

}

========================================================= */

function checkLevelUp(){

while(
game.player.xp>=
game.player.level*100
){

const required=
game.player.level*100;

game.player.xp-=required;
game.player.level++;

game.player.maxHp+=5;
game.player.hp=
game.player.maxHp;

addStoryMessage(`

🌟 <b>SEVİYE ATLADIN!</b>

<br><br>

⭐ Yeni seviye:
<b>${game.player.level}</b>

<br><br>

❤️ Maksimum canın arttı.

`);

}

}

function createCharacter(){

const className=$("classInput").value;

const bonus=raceBonuses[race];

game.player.race=race;
game.player.className=className;
game.player.background=background;

base.strength+(bonus.strength||0),

base.dexterity+(bonus.dexterity||0),

intelligence:
base.intelligence+(bonus.intelligence||0),

wisdom:
base.wisdom+(bonus.wisdom||0),

charisma:
base.charisma+(bonus.charisma||0)

};

game.player.maxHp=base.maxHp;

game.player.equippedWeapon=null;

item=>{
if(item.type==="weapon")

);

========================================================= */

function loadGame(){

const saved=
localStorage.getItem(
"realmOfShadowsSave"
);

if(!saved){

addStoryMessage(
"📂 Kaydedilmiş oyun bulunamadı."
);

return;

}

try{

const data=JSON.parse(saved);

Object.assign(game.player,data.player);
Object.assign(game.world,data.world);
Object.assign(game.story,data.story);

game.npcs=data.npcs||[];
game.quests=data.quests||[];
game.factions=data.factions||[];
game.locations=data.locations||[];

game.combat=data.combat||{
active:false,
enemy:null,
round:0
};

game.ai=data.ai||{
lastResponse:null,
history:[]
};

updateAllUI();

addStoryMessage(
"📂 Kaydedilmiş macera geri yüklendi."
);

}catch(error){

console.error(error);

addStoryMessage(
"❌ Kayıt dosyası okunamadı."
);

}

}
