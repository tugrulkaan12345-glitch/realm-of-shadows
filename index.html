<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Realm of Shadows</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div id="game">

    <!-- =========================
         ÜST MENÜ
    ========================== -->

    <header class="topbar">

        <div class="logo">
            ⚔️ Realm of Shadows
        </div>

        <div class="top-buttons">

            <button id="characterButton">
                Karakter
            </button>

            <button id="inventoryButton">
                Envanter
            </button>

            <button id="saveButton">
                Kaydet
            </button>

            <button id="loadButton">
                Yükle
            </button>

        </div>

    </header>


    <!-- =========================
         ANA OYUN
    ========================== -->

    <main class="game-layout">


        <!-- =====================
             SOL PANEL
        ====================== -->

        <aside class="left-panel">

            <section class="character-card">

                <div class="avatar">
                    🧙
                </div>

                <h2 id="characterName">
                    Arden
                </h2>

                <p id="characterClass">
                    Savaşçı
                </p>

            </section>


            <section class="stats-card">

                <h3>
                    Karakter
                </h3>

                <div class="stat">

                    <span>
                        ❤️ Can
                    </span>

                    <strong id="hp">
                        20 / 20
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        ⭐ Seviye
                    </span>

                    <strong id="level">
                        1
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        ✨ XP
                    </span>

                    <strong id="xp">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        💰 Altın
                    </span>

                    <strong id="gold">
                        25
                    </strong>

                </div>

            </section>


            <section class="stats-card">

                <h3>
                    Özellikler
                </h3>


                <div class="ability">

                    <span>
                        Güç
                    </span>

                    <strong id="strength">
                        16
                    </strong>

                </div>


                <div class="ability">

                    <span>
                        Çeviklik
                    </span>

                    <strong id="dexterity">
                        12
                    </strong>

                </div>


                <div class="ability">

                    <span>
                        Dayanıklılık
                    </span>

                    <strong id="constitution">
                        15
                    </strong>

                </div>


                <div class="ability">

                    <span>
                        Zeka
                    </span>

                    <strong id="intelligence">
                        10
                    </strong>

                </div>


                <div class="ability">

                    <span>
                        Bilgelik
                    </span>

                    <strong id="wisdom">
                        11
                    </strong>

                </div>


                <div class="ability">

                    <span>
                        Karizma
                    </span>

                    <strong id="charisma">
                        10
                    </strong>

                </div>

            </section>

        </aside>


        <!-- =====================
             HİKAYE
        ====================== -->

        <section class="story-panel">

            <div class="location">

                <span>
                    📍 Konum
                </span>

                <strong id="location">
                    Blackmoor Köyü
                </strong>

            </div>


            <div
                id="story"
                class="story"
            >

                <!-- JavaScript buraya hikaye ekleyecek -->

            </div>


            <!-- =================
                 OYUNCU EYLEMİ
            ================== -->

            <div class="action-area">

                <textarea
                    id="playerInput"
                    placeholder="Karakterinin ne yaptığını kendi cümlelerinle yaz..."
                ></textarea>


                <button
                    id="actionButton"
                    class="action-button"
                    type="button"
                >
                    Eylemi Gerçekleştir
                </button>

            </div>

        </section>


        <!-- =====================
             SAĞ PANEL
        ====================== -->

        <aside class="right-panel">


            <section class="side-card">

                <h3>
                    🎒 Envanter
                </h3>

                <div id="inventory">

                    <p class="empty">
                        Envanter yükleniyor...
                    </p>

                </div>

            </section>


            <section class="side-card">

                <h3>
                    📜 Görevler
                </h3>

                <div id="quests">

                    <p class="empty">
                        Görevler yükleniyor...
                    </p>

                </div>

            </section>


            <section class="side-card dice-card">

                <h3>
                    🎲 Zar
                </h3>

                <div
                    id="diceResult"
                    class="dice-result"
                >
                    -
                </div>


                <button
                    id="rollButton"
                    class="dice-button"
                    type="button"
                >
                    D20 At
                </button>

            </section>

        </aside>

    </main>

</div>


<!-- =========================
     KARAKTER MODALI
========================== -->

<div
    id="characterModal"
    class="modal hidden"
>

    <div class="modal-content">

        <button
            class="close"
            id="closeCharacter"
            type="button"
        >
            ×
        </button>


        <h2>
            🧙 Karakterini Oluştur
        </h2>


        <label for="nameInput">
            Karakter adı
        </label>

        <input
            id="nameInput"
            type="text"
            placeholder="Örn. Arden"
        >


        <label for="raceInput">
            Irk
        </label>

        <select id="raceInput">

            <option value="İnsan">
                İnsan
            </option>

            <option value="Elf">
                Elf
            </option>

            <option value="Cüce">
                Cüce
            </option>

            <option value="Buçukluk">
                Buçukluk
            </option>

            <option value="Yarı-Ork">
                Yarı-Ork
            </option>

        </select>


        <label for="classInput">
            Sınıf
        </label>

        <select id="classInput">

            <option value="Savaşçı">
                Savaşçı
            </option>

            <option value="Büyücü">
                Büyücü
            </option>

            <option value="Hırsız">
                Hırsız
            </option>

            <option value="Paladin">
                Paladin
            </option>

            <option value="Korucu">
                Korucu
            </option>

        </select>


        <label for="backgroundInput">
            Geçmiş
        </label>

        <select id="backgroundInput">

            <option value="Gezgin">
                Gezgin
            </option>

            <option value="Asker">
                Asker
            </option>

            <option value="Suçlu">
                Suçlu
            </option>

            <option value="Bilgin">
                Bilgin
            </option>

            <option value="Soylu">
                Soylu
            </option>

        </select>


        <button
            id="createCharacter"
            class="action-button"
            type="button"
        >
            Karakteri Oluştur
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
